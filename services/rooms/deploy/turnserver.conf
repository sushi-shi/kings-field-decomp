# Replace the domain and shared secret. Run using the packaged coturn service.
# Options: https://github.com/coturn/coturn/blob/master/examples/etc/turnserver.conf
# Install a trusted certificate for the relay domain and a private key readable
# by coturn. Refresh these files and restart coturn after certificate renewal.
listening-port=3478
tls-listening-port=5349
cert=/etc/coturn/certs/turn.example.com/fullchain.pem
pkey=/etc/coturn/certs/turn.example.com/privkey.pem
min-port=49160
max-port=49260
realm=turn.example.com
fingerprint
use-auth-secret
static-auth-secret=REPLACE_WITH_THE_SAME_RANDOM_SECRET_AS_THE_ROOM_SERVICE
no-cli
no-dtls
no-multicast-peers

# For a server behind NAT, map its public address to its local relay interface
# and forward the listener and entire relay range without changing port numbers:
# external-ip=PUBLIC_IP/PRIVATE_IP

# Keep relay destinations out of the server's private networks.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
